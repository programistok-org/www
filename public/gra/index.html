    <style>
      /* programistok.org/gra - key legend for keyboard players */
      #legend {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 72px;
        box-sizing: border-box;
        padding: 0 16px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 40px;
        background: #071821;
        border-top: 1px solid #1f3a44;
        color: #e0f8cf;
        font: 15px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      html.no-touch #legend {
        display: flex;
      }
      /* The screen ends where the legend begins - it never covers the game.
         An explicit height: the canvas is sized as a percentage of this box
         and with an auto height it ballooned to the full width and got
         cropped. */
      html.no-touch #game {
        height: calc(100% - 72px);
      }
      html.no-touch #game canvas {
        max-width: 100%;
        max-height: 100%;
      }
      #legend .key {
        display: flex;
        align-items: center;
        gap: 12px;
        white-space: nowrap;
      }
      #legend .caps {
        display: flex;
        gap: 4px;
      }
      #legend kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 36px;
        height: 36px;
        padding: 0 8px;
        box-sizing: border-box;
        border-radius: 6px;
        background: linear-gradient(#ffffff, #e4e4e4);
        border: 1px solid #b4b4b4;
        border-bottom: 3px solid #8e8e8e;
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
        color: #222;
        font: 600 15px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      #legend .caps kbd {
        min-width: 32px;
        height: 32px;
        padding: 0;
        font-size: 14px;
      }
      #legend .does {
        color: #e0f8cf;
      }
    </style>

        <div id="controller_up"></div>

      <div id="controller_select" class="capsuleBtn">Select</div>

      <div id="controller_b" class="roundBtn">B</div>
      <div id="controller_a" class="roundBtn">A</div>

    <div id="legend">
      <div class="key">
        <span class="caps"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></span>
        <span class="does">ruch</span>
      </div>
      <div class="key">
        <kbd>Z</kbd>
        <span class="does">potwierdź / rozmawiaj</span>
      </div>
      <div class="key">
        <kbd>X</kbd>

      <div class="key">
        <kbd class="wide">Enter</kbd>
        <span class="does">start</span>

    <script>
      // Desktop gets the key legend; touch devices get the on-screen pad.
      if (!("ontouchstart" in document.documentElement)) document.documentElement.classList.add("no-touch");
      // iOS: the ring/silent switch mutes Web Audio unless an HTML media
      // element is playing, so the first tap starts a silent loop. The
      // player resumes its own AudioContext from the same tap.
      (function () {
        var tag = document.createElement("audio");
        tag.setAttribute("playsinline", "");
        tag.setAttribute("preload", "auto");
        tag.loop = true;
        tag.src = "data:audio/wav;base64,UklGRmQfAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAfAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC         var done = false;
        function unlock() {
          if (done) return;
          done = true;
          var p = tag.play();
          if (p && p.catch) p.catch(function () {});
          document.removeEventListener("touchend", unlock, true);
          document.removeEventListener("click", unlock, true);
          document.removeEventListener("keydown", unlock, true);
        }
        document.addEventListener("touchend", unlock, true);
        document.addEventListener("click", unlock, true);
        document.addEventListener("keydown", unlock, true);
      })();
    </script>
